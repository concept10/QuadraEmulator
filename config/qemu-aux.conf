# QEMU Configuration for Macintosh Quadra 800 A/UX Emulation
# This file contains default settings and can be modified as needed

[machine]
name = "Apple A/UX 3.0.1"
type = q800
memory = 128

[display]
mode = sdl
graphics = 800x600x8
# Alternative VNC mode:
# mode = vnc=:1

[network]
model = dp83932
type = user
# Port forwarding examples:
# hostfwd = tcp::2222-:22
# hostfwd = tcp::8080-:80

[bridge_network]
# Bridge networking configuration
bridge_name = br0
tap_interface = tap0
bridge_ip = 192.168.100.1
dhcp_range = 192.168.100.100-192.168.100.200
# Enable with: ./scripts/start-qemu.sh --bridge

[audio]
driver = none
# Audio emulation is poor, disabled by default

[devices]
# SCSI devices configuration
hdd_vendor = "SEAGATE"
hdd_product = "ST225N"
hdd_version = "1.0"

cdrom_vendor = "MATSHITA"
cdrom_product = "CD-ROM CR-8005"
cdrom_version = "1.0k"

[files]
# Default file paths (relative to storage directory)
rom = roms/q800.rom
nvram = nvram/nvram.bin
hdd = disks/scsi0.qcow2
cdrom = cdrom/cdrom.iso
boot_floppy = disks/boot.img

[logging]
# Log configuration
log_file = logs/qemu.log
serial_log = logs/serial.log
